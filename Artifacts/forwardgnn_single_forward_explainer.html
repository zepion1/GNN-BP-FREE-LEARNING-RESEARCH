<h2 class="sr-only">Interactive explainer of ForwardGNN single-forward learning: a graph with per-class virtual nodes on the left, and the contrastive loss for a selected real node against the class representatives on the right.</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 1rem">
  <div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:13px;color:var(--text-secondary)">Training progress <span id="t-out" style="font-weight:500;color:var(--text-primary)">0%</span></label><input type="range" id="t" min="0" max="1" step="0.05" value="0" oninput="upd()"></div>
  <div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:13px;color:var(--text-secondary)">Temperature τ <span id="tau-out" style="font-weight:500;color:var(--text-primary)">1.0</span></label><input type="range" id="tau" min="0.2" max="3" step="0.1" value="1" oninput="upd()"></div>
</div>
<svg width="100%" viewBox="0 0 680 360" role="img"><title>Augmented graph and contrastive loss</title><desc>Left: real nodes colored by class, dashed links to one virtual node per class. Right: similarity and softmax bars for the selected node.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="24" dominant-baseline="central">Augmented graph G′ (one pass)</text>
<g id="edges"></g>
<g id="nodes"></g>
<text class="ts" x="40" y="340" dominant-baseline="central">Circle = real node, square = virtual class node, dashed = label link</text>
<text id="sel-title" class="th" x="380" y="24" dominant-baseline="central">Selected node</text>
<text class="ts" x="380" y="52" dominant-baseline="central">Similarity C(hᵢ, cₖ)</text>
<g id="simbars"></g>
<text class="ts" x="380" y="172" dominant-baseline="central">Softmax over classes pₖ</text>
<g id="probbars"></g>
<text id="loss-txt" class="th" x="380" y="310" dominant-baseline="central">Loss = −log p(true class) = 0.00</text>
</svg>
<script>
var CLS=[{n:'Class A',f:'#AFA9EC',s:'#534AB7',d:'#26215C'},{n:'Class B',f:'#5DCAA5',s:'#0F6E56',d:'#04342C'},{n:'Class C',f:'#F0997B',s:'#993C1D',d:'#4A1B0C'}];
var N=[{id:1,x:90,y:90,c:0,b:[0.6,1.1,0.2]},{id:2,x:150,y:160,c:0,b:[0.3,0.4,1.0]},{id:3,x:255,y:80,c:1,b:[1.2,0.1,0.7]},{id:4,x:280,y:170,c:1,b:[0.5,0.9,1.3]},{id:5,x:110,y:250,c:2,b:[0.9,0.8,0.1]},{id:6,x:225,y:270,c:2,b:[1.0,0.2,0.4]},{id:7,x:195,y:150,c:-1,b:[0.5,0.5,0.5]}];
var V=[{x:44,y:180,c:0},{x:310,y:44,c:1},{x:170,y:320,c:2}];
var E=[[1,2],[2,7],[7,3],[3,4],[2,5],[7,6],[5,6],[4,6]];
var sel=1;
function node(i){return N[i-1];}
function draw(){var eh='';E.forEach(function(e){var a=node(e[0]),b=node(e[1]);eh+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#888780" stroke-width="1"/>';});
N.forEach(function(n){if(n.c<0)return;var v=V[n.c];eh+='<line x1="'+n.x+'" y1="'+n.y+'" x2="'+v.x+'" y2="'+v.y+'" stroke="'+CLS[n.c].s+'" stroke-width="1" stroke-dasharray="4 3"/>';});
document.getElementById('edges').innerHTML=eh;
var nh='';V.forEach(function(v){nh+='<rect x="'+(v.x-14)+'" y="'+(v.y-14)+'" width="28" height="28" rx="4" fill="'+CLS[v.c].f+'" stroke="'+CLS[v.c].s+'" stroke-width="1"/><text class="ts" x="'+v.x+'" y="'+v.y+'" text-anchor="middle" dominant-baseline="central" fill="'+CLS[v.c].d+'" style="fill:'+CLS[v.c].d+'">c'+'ABC'[v.c]+'</text>';});
N.forEach(function(n){var f=n.c<0?'#D3D1C7':CLS[n.c].f,s=n.c<0?'#5F5E5A':CLS[n.c].s,d=n.c<0?'#2C2C2A':CLS[n.c].d;nh+='<g style="cursor:pointer" onclick="pick('+n.id+')"><circle cx="'+n.x+'" cy="'+n.y+'" r="'+(n.id===sel?17:13)+'" fill="'+f+'" stroke="'+s+'" stroke-width="'+(n.id===sel?2.5:1)+'"/><text class="ts" x="'+n.x+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="central" style="fill:'+d+'">'+(n.c<0?'?':n.id)+'</text></g>';});
document.getElementById('nodes').innerHTML=nh;}
function pick(i){if(node(i).c<0){sendPrompt('In ForwardGNN single-forward, what happens to unlabeled nodes like test nodes during training and inference?');return;}sel=i;draw();upd();}
function upd(){var t=+document.getElementById('t').value,tau=+document.getElementById('tau').value;document.getElementById('t-out').textContent=Math.round(t*100)+'%';document.getElementById('tau-out').textContent=tau.toFixed(1);
var n=node(sel),sim=[],ex=[],Z=0;for(var k=0;k<3;k++){var tg=(k===n.c)?3.0:-0.8;sim[k]=(1-t)*n.b[k]+t*tg;ex[k]=Math.exp(sim[k]/tau);Z+=ex[k];}
var p=ex.map(function(v){return v/Z;});var loss=-Math.log(p[n.c]);
document.getElementById('sel-title').textContent='Node '+sel+' (true class '+'ABC'[n.c]+')';
var sh='',ph='';for(var k=0;k<3;k++){var y=68+k*32,w=Math.max(2,(sim[k]+1)/4.2*200),y2=188+k*32,w2=p[k]*200;
sh+='<text class="ts" x="380" y="'+(y+10)+'" dominant-baseline="central">c'+'ABC'[k]+'</text><rect x="410" y="'+y+'" width="'+w+'" height="20" rx="3" fill="'+CLS[k].f+'" stroke="'+CLS[k].s+'" stroke-width="'+(k===n.c?1.5:0.5)+'"/><text class="ts" x="'+(416+w)+'" y="'+(y+10)+'" dominant-baseline="central">'+sim[k].toFixed(2)+'</text>';
ph+='<text class="ts" x="380" y="'+(y2+10)+'" dominant-baseline="central">p'+'ABC'[k]+'</text><rect x="410" y="'+y2+'" width="'+w2+'" height="20" rx="3" fill="'+CLS[k].f+'" stroke="'+CLS[k].s+'" stroke-width="'+(k===n.c?1.5:0.5)+'"/><text class="ts" x="'+(416+w2)+'" y="'+(y2+10)+'" dominant-baseline="central">'+p[k].toFixed(2)+'</text>';}
document.getElementById('simbars').innerHTML=sh;document.getElementById('probbars').innerHTML=ph;
document.getElementById('loss-txt').textContent='Loss = −log p(true class) = '+loss.toFixed(2);}
draw();upd();
</script>
